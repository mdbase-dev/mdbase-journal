name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Journal CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-bin-links --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:publisher
      - run: npm run build:ci
        env:
          NATIVE_SDK_SHA256: e64771a90bed2fb3837d4b65df8930fcd124d3059fcb0bcbaf9d64dbfb148205
          NATIVE_UI_SHA256: e3da3c19b49ee90d3d19df2ea4a1a387b158decfccc8000371f93170eb30b723
          NATIVE_PROTOCOL_SHA256: cd1e15236ab7e25c511a4ba13af6a9df23f4b41715161479bba97b0445e1c138
          NATIVE_TRUST_ASSET_SHA256: 7912e40838213e60b65848350d319a48019021317b112e3326429b250f0133d7
