name: Publish immutable Journal

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit, reachable from main.
        required: true
        type: string
      target:
        description: Journal target; dispatch this workflow on main.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      drill:
        description: Deliberately fail smoke after uploading the already-live production source (manual only).
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: journal-pages-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# CI is ci.yml. Ops and direct operators dispatch this immutable publisher.
jobs:
  admit:
    # Validate dispatch shape before acquiring an environment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DRILL: ${{ inputs.drill && 'true' || 'false' }}
        run: |
          set -euo pipefail
          case "$TARGET" in staging|production) ;; *) exit 1 ;; esac
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          node scripts/publisher/refs.mjs
          node scripts/publisher/drill.mjs admit

  inputs:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: journal-${{ inputs.target }}
    outputs:
      trust: ${{ steps.hashes.outputs.trust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow-owned ancestry check before reading environment inputs
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publisher/refs.mjs
      - id: hashes
        env:
          JOURNAL_TRUST_ASSET_SHA256: ${{ vars.JOURNAL_TRUST_ASSET_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$JOURNAL_TRUST_ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'trust=%s\n' "$JOURNAL_TRUST_ASSET_SHA256" >> "$GITHUB_OUTPUT"

  build:
    name: Unprivileged frozen Journal build
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No GitHub environment or Cloudflare secrets. Original intake before hooks.
    defaults:
      run:
        working-directory: candidate
    env:
      TARGET: ${{ inputs.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      # Public build inputs: Pages runtime variables do not configure Vite assets.
      VITE_MDBASE_FEEDBACK_URL: ${{ inputs.target == 'production' && 'https://feedback-api.mdbase.dev/v1/feedback' || 'https://feedback-api-staging.mdbase.dev/v1/feedback' }}
      VITE_MDBASE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ inputs.target == 'production' && '0x4AAAAAAEboz_mLT-taI3H-' || '0x4AAAAAAEbkvA4d9vQJq2D1' }}
      JOURNAL_TRUST_ASSET_SHA256: ${{ needs.inputs.outputs.trust }}
      JOURNAL_SOURCE_ROOT: ${{ github.workspace }}/candidate
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow-owned ancestry check before candidate checkout or execution
        working-directory: publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publisher/refs.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Data-only original intake before dependency execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journal-build"
          node ../publisher/scripts/publisher/publisher.mjs guard > "$RUNNER_TEMP/journal-build/plan.json"
      - run: node ../publisher/scripts/publisher/install-inputs.mjs "$RUNNER_TEMP/journal-build/plan.json"
      - run: npm ci --ignore-scripts --no-bin-links --no-audit --no-fund
      - name: ALL installed original members, then unprivileged build once
        run: node ../publisher/scripts/publisher/build.mjs "$RUNNER_TEMP/journal-build"
      - run: node ../publisher/scripts/publisher/envelope.mjs "$RUNNER_TEMP/journal-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: journal-build-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain failed build plan without manufacturing a successful artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-build-failure-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Protected immutable Journal upload
    needs: [inputs, build]
    outputs:
      ready: ${{ steps.compatibility.outputs.ready }}
    runs-on: ubuntu-24.04
    # Upload has a separate 7-minute bound; leave time for checks and recovery.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: publisher
    concurrency:
      group: journal-upload-${{ inputs.target }}
      cancel-in-progress: false
    # External environment policy admits main without per-publish approval.
    environment:
      name: journal-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://journal.mdbase.dev/' || 'https://staging.mdbase-journal.pages.dev/' }}
    env:
      TARGET: ${{ inputs.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      JOURNAL_TRUST_ASSET_SHA256: ${{ vars.JOURNAL_TRUST_ASSET_SHA256 }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      JOURNAL_SOURCE_ROOT: ${{ github.workspace }}/candidate
      WRANGLER_SEND_METRICS: "false"
    steps:
      # A recovery point must predate everything its run published.
      - name: One publication per run; dispatch a new run to retry
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - name: Workflow-owned ancestry check before candidate data is read
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publisher/refs.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
        timeout-minutes: 2
      - name: Workflow-owned guard; candidate is data only
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journal-receipt" "$RUNNER_TEMP/journal-upload"
          node scripts/publisher/publisher.mjs guard > "$RUNNER_TEMP/journal-receipt/plan.json"
      - name: Isolated official tool lock only; no app hooks
        timeout-minutes: 3
        run: node scripts/publisher/tool.mjs "$RUNNER_TEMP/journal-tool-path"
      - name: Immutable artifact identity and full original inventory
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/publisher/artifact.mjs "$RUNNER_TEMP/journal-upload/artifact"
          cp "$RUNNER_TEMP/journal-upload/artifact/"{inventory.json,envelope.json} "$RUNNER_TEMP/journal-receipt/"
          cp "$RUNNER_TEMP/journal-upload/artifact-metadata.json" "$RUNNER_TEMP/journal-receipt/"
          cmp "$RUNNER_TEMP/journal-receipt/plan.json" "$RUNNER_TEMP/journal-upload/artifact/plan.json"
          node scripts/publisher/publisher.mjs inventory "$RUNNER_TEMP/journal-upload/artifact/publish" "$RUNNER_TEMP/journal-receipt/plan.json" > "$RUNNER_TEMP/journal-receipt/revalidated-inventory.json"
          cmp "$RUNNER_TEMP/journal-receipt/inventory.json" "$RUNNER_TEMP/journal-receipt/revalidated-inventory.json"
          chmod -R a-w "$RUNNER_TEMP/journal-upload/artifact"
      - name: Existing project identity (never provision)
        timeout-minutes: 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publisher/publisher.mjs project > "$RUNNER_TEMP/journal-receipt/project.json"
      - name: Live production contains the authenticated SDK producer
        id: compatibility
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publisher/compatibility.mjs "$RUNNER_TEMP/journal-receipt/plan.json" "$RUNNER_TEMP/journal-receipt/compatibility.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        timeout-minutes: 2
        with:
          name: journal-compatibility-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-receipt/compatibility.json
          if-no-files-found: error
          retention-days: 90
      - name: Capture production recovery point before upload
        if: steps.compatibility.outputs.ready == 'true'
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publisher/rollback.mjs snapshot "$RUNNER_TEMP/journal-receipt"
      # Stored before upload, so recovery survives a lost job or receipt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.target == 'production' && steps.compatibility.outputs.ready == 'true'
        timeout-minutes: 2
        with:
          name: journal-production-recovery-point-${{ github.run_id }}
          path: ${{ runner.temp }}/journal-receipt/previous.json
          if-no-files-found: error
          retention-days: 90
      - name: Drill requires the exact source already live before upload
        if: inputs.drill && steps.compatibility.outputs.ready == 'true'
        timeout-minutes: 1
        env:
          DRILL: ${{ inputs.drill && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publisher/drill.mjs before-upload "$RUNNER_TEMP/journal-receipt"
      - name: Recheck immutable inventory and upload once
        id: upload
        if: steps.compatibility.outputs.ready == 'true'
        timeout-minutes: 7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/publisher/refs.mjs
          branch=$(jq -er .pagesBranch "$RUNNER_TEMP/journal-receipt/plan.json")
          node scripts/publisher/publisher.mjs assert-inventory "$RUNNER_TEMP/journal-upload/artifact/publish" "$RUNNER_TEMP/journal-receipt/inventory.json"
          cli=$(cat "$RUNNER_TEMP/journal-tool-path")
          cd "$RUNNER_TEMP/journal-upload"
          node "$cli" pages deploy artifact/publish --no-bundle --project-name mdbase-journal --branch "$branch" --commit-hash "$SOURCE_SHA" --commit-dirty=false > "$RUNNER_TEMP/journal-upload/wrangler-output.txt" 2>&1
      - name: Resolve actual full deployment UUID before served checks
        id: deployment
        timeout-minutes: 1
        if: always() && steps.compatibility.outputs.ready == 'true' && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure' || steps.upload.outcome == 'cancelled')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publisher/publisher.mjs capture "$RUNNER_TEMP/journal-upload/wrangler-output.txt" > "$RUNNER_TEMP/journal-receipt/deployment.json"
      - name: All deployment URL AND alias bytes, source-owned headers and routes
        id: verification
        timeout-minutes: 9
        if: always() && steps.compatibility.outputs.ready == 'true' && steps.deployment.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRILL: ${{ inputs.drill && 'true' || 'false' }}
        run: |
          set -euo pipefail
          node scripts/publisher/hosting.mjs "$RUNNER_TEMP/journal-receipt/plan.json" "$RUNNER_TEMP/journal-receipt/inventory.json" "$RUNNER_TEMP/journal-receipt/deployment.json" "$RUNNER_TEMP/journal-upload/artifact" > "$RUNNER_TEMP/journal-receipt/verification.json"
          if [ "$DRILL" = true ]; then node scripts/publisher/drill.mjs uploaded "$RUNNER_TEMP/journal-receipt"; fi
      - name: Preserve honest failure or complete static-publication receipt
        timeout-minutes: 1
        if: always() && steps.compatibility.outputs.ready == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/journal-upload/artifact-metadata.json" ]; then cp "$RUNNER_TEMP/journal-upload/artifact-metadata.json" "$RUNNER_TEMP/journal-receipt/"; fi
          node scripts/publisher/publisher.mjs receipt "$RUNNER_TEMP/journal-receipt" > "$RUNNER_TEMP/journal-receipt/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        if: always()
        with:
          name: journal-receipt-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-receipt/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  smoke:
    name: Journal fresh-browser smoke
    needs: publish
    if: needs.publish.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No environment, Cloudflare credentials, candidate checkout or app install.
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET: ${{ inputs.target }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.journal-smoke-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Isolated pinned browser tool with install scripts disabled
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node scripts/publisher/tool.mjs "$RUNNER_TEMP/journal-smoke-tool" smoke
          module=$(cat "$RUNNER_TEMP/journal-smoke-tool")
          node "$(dirname "$module")/cli.js" install --with-deps chromium
      - name: Fresh load, source entry asset, readiness and sign-in
        timeout-minutes: 3
        run: node scripts/publisher/smoke.mjs "$RUNNER_TEMP/journal-smoke-tool" "$RUNNER_TEMP/journal-smoke.json"
      - name: Read this run's verified upload receipt for the manual drill
        if: inputs.drill && inputs.target == 'production' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "journal-receipt-production-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/journal-drill"
      - name: Deliberate smoke failure after real same-source production upload
        if: inputs.drill && inputs.target == 'production' && github.event_name == 'workflow_dispatch'
        env:
          DRILL: ${{ inputs.drill && 'true' || 'false' }}
        run: node scripts/publisher/drill.mjs fail "$RUNNER_TEMP/journal-drill" "$RUNNER_TEMP/journal-drill.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.drill
        with:
          name: journal-production-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-drill.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journal-${{ inputs.target }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-smoke.json
          if-no-files-found: warn
          retention-days: 90

  production-recovery:
    name: Restore production after incomplete publication or smoke
    needs: [publish, smoke]
    # A job-level always() still runs after cancellation or a job timeout.
    if: always() && inputs.target == 'production' && needs.publish.result != 'skipped' && needs.smoke.result != 'success' && needs.publish.outputs.ready != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: journal-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
        timeout-minutes: 2
      - name: Find the recovery point stored before upload
        id: point
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=journal-production-recovery-point-$GITHUB_RUN_ID" --jq '[.artifacts[]|select(.expired|not)]|first|.id // empty')
          if [ -z "$id" ] && [ "$DEPLOY_RESULT" = success ]; then
            echo 'A completed publication has no recovery point' >&2
            exit 1
          fi
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.point.outputs.artifact-id != ''
        timeout-minutes: 2
        with:
          artifact-ids: ${{ steps.point.outputs.artifact-id }}
          path: ${{ runner.temp }}/journal-recovery
          merge-multiple: true
      - name: Restore snapshot and verify every previous asset; keep run failed
        if: steps.point.outputs.artifact-id != ''
        timeout-minutes: 7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publisher/rollback.mjs recover "$RUNNER_TEMP/journal-recovery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        if: always() && steps.point.outputs.artifact-id != ''
        with:
          name: journal-production-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-recovery/
          if-no-files-found: warn
          retention-days: 90
