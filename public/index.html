<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Journal</title>
<meta name="description" content="A blank page every time you open it. Each note becomes a Markdown record in your mdbase collection.">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mdbase-collections.css">
<link rel="stylesheet" href="./journal.css">
</head>
<body>
<header>
  <div class="context"><span id="when"></span><span id="collection-switcher" hidden></span></div>
  <button id="menu-button" aria-haspopup="dialog" aria-controls="menu" aria-label="Journal settings">•••</button>
</header>
<main>
  <textarea id="page" aria-label="Note" spellcheck="true" autocapitalize="sentences"></textarea>
</main>
<footer>
  <button class="status" id="status-button" aria-live="polite" aria-label="Journal settings"><i class="dot" id="dot"></i><span id="status"></span></button>
  <span class="hint">
    <span id="word-count" class="count" hidden></span>
    <button id="undo-button" hidden>Undo new page</button>
    <button id="new-button" hidden><span class="keys" id="keys"></span> New page</button>
  </span>
</footer>
<dialog id="menu" aria-labelledby="journal-settings-title" aria-describedby="menu-connection">
  <div class="sheet">
    <h2 id="journal-settings-title">Journal</h2>
    <p id="menu-connection"></p>
    <div id="collection-row" class="row">
      <div id="collection-panel"></div>
      <p>Switching starts a new page. Existing notes stay with their original collection.</p>
    </div>
    <div class="row">
      <span class="label">Appearance</span>
      <div class="segmented" id="theme-choice" role="group" aria-label="Appearance">
        <button data-theme-choice="system">System</button>
        <button data-theme-choice="light">Light</button>
        <button data-theme-choice="dark">Dark</button>
      </div>
    </div>
    <div class="row">
      <label for="folder">Folder for new notes</label>
      <input id="folder" autocomplete="off" spellcheck="false">
    </div>
    <div id="type-row" class="row" hidden>
      <label for="entry-type">New notes are saved as</label>
      <select id="entry-type"></select>
    </div>
    <div id="pending-row" class="row" hidden>
      <span class="label">On this device</span>
      <span id="pending-count"></span>
      <div id="pending-details"></div>
    </div>
    <p>To read old notes, open the collection in Editor or any other app.</p>
    <div class="actions">
      <button id="close-menu">Done</button>
    </div>
  </div>
</dialog>
<script type="module" src="./journal.js"></script>
</body>
</html>
