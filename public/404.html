<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Journal</title>
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light dark; --bg:#f7f5f0; --ink:#22201c; --muted:#6f6a61; --accent:#5b6b4e; }
@media (prefers-color-scheme:dark) { :root { --bg:#161513; --ink:#e8e4da; --muted:#8b867b; --accent:#a9b897; } }
html, body { height:100%; margin:0; }
body { display:grid; place-items:center; padding:16px; box-sizing:border-box; background:var(--bg); color:var(--ink); font:400 .875rem/1.4 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
main { max-width:680px; }
h1 { margin:0 0 .75rem; font:400 1.3125rem/1.6 Newsreader,Georgia,serif; }
p { margin:0 0 1.25rem; color:var(--muted); }
a { color:var(--accent); }
a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
</style>
<script type="module" src="/mdbase-shell-register.js"></script>
</head>

<main>
